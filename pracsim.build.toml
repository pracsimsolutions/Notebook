[product]
name           = "Notebook"
display_name   = "PracSim Notebook"
description    = "PracSim Notebook — a tabbed notebook docked inside FlexSim's 3D modeler."
url            = "https://github.com/pracsimsolutions/Notebook"

[wix]
# FIXED FOREVER. Changing either GUID breaks MSI in-place upgrades.
upgrade_code         = "10175053-2461-4D1E-BDEB-4451A8A89117"
component_guid_prefix = "39DDFA8F-20BD-4843-8A83-EB0B84D6B"

# Installer artwork. The names below are resolved against the maintainers'
# brand asset folder when an installer is built; they are not files in this
# repo, and they are not needed to build or run the module itself.
[brand]
icon_svg     = "notebook.svg"
banner_svg   = "installer/notebook-banner.svg"
dialog_svg   = "installer/notebook-dialog.svg"
toolbox_png  = "bitmaps/notebook.png"

[payload]
# What an installer ships. APPEND ONLY.
# Notebook.png is NOT listed: it is staged automatically from
# [brand].toolbox_png, and listing it here would install the same file twice.
files = [
    "Notebook.t",
    "Notebook.dll",
    "LICENSE.txt",
]

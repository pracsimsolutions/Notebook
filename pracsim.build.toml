[product]
name           = "Notebook"
display_name   = "PracSim Notebook"
description    = "PracSim Notebook — a tabbed notebook docked inside FlexSim's 3D modeler."
url            = "https://github.com/pracsimsolutions/Notebook"

[wix]
# FIXED FOREVER. Changing either GUID breaks MSI in-place upgrades.
upgrade_code         = "10175053-2461-4D1E-BDEB-4451A8A89117"
component_guid_prefix = "39DDFA8F-20BD-4843-8A83-EB0B84D6B"

[flexsim]
default_version_dir = "FlexSim 2026"

# [payload].root (optional, omitted here)
#   This module ships the files as they sit in this working tree, so there is
#   nothing to declare. A module whose shipped bytes DIFFER from its source --
#   comment-stripped scripts, a compiled exe replacing a script, build output that
#   must not travel -- prepares a clean payload folder with its own tooling and
#   names it here:
#
#       root = "dist/preflight-staged"
#
#   `files` and `subdirs` are then read from that folder instead of this one. If
#   it's declared and missing, the build STOPS rather than falling back to the
#   working tree. See docs/manifest-schema.md in module-builder.
[payload]
files = [
    "Notebook.t",
    "Notebook.dll",
    "Notebook.png",
    "LICENSE.txt",
    "README.md",
]
